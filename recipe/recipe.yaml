context:
  name: d2
  version: "0.9.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - target_directory: src
    url: https://github.com/terrastruct/d2/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 1256ad3907bceb4fcee7ed40d17c5726f8b602eea900e94500ba3352e96febbc
  - url: https://raw.githubusercontent.com/golang/freetype/refs/heads/master/LICENSE
    sha256: d3ba056adc2b7909e95681deaae397fb37c97ed491a920f491214f07b62c41d0
    file_name: freetype-license.txt
  - url: https://github.com/golang/freetype/raw/refs/heads/master/licenses/ftl.txt
    sha256: f4b133e25df1f86ad3ffea453aa0e613f0474f34778dbbb3e437e7b2724937d8
    file_name: freetype-license-ftl.txt
  - url: https://github.com/golang/freetype/raw/refs/heads/master/licenses/gpl.txt
    sha256: c4120c6752c910c299e3bd9cb3a46ff262c268303ca2069b61f92f10a5656c18
    file_name: freetype-license-gpl.txt
  - url: https://github.com/dop251/goja/raw/refs/heads/master/ftoa/LICENSE_LUCENE
    sha256: eb4df27f95a096a23d88e567331a4bee5590d22185942a1b0456197e29d03e59
    file_name: goja-ftoa-license.txt
  - url: https://raw.githubusercontent.com/alecthomas/chroma/v2.27.0/COPYING
    sha256: 13654b052f885cb3fa47d7343e13975d9c8a64c3bcd84993c35d5eb01f22b23f
    file_name: chroma-license.txt

build:
  number: 0

requirements:
  build:
    - ${{ compiler("go-nocgo") }}
    - ${{ stdlib("c") }}
    - go-licenses

tests:
  - script:
      - d2 --help
      - d2 layout tala
      - d2 layout elk

about:
  homepage: https://github.com/terrastruct/d2
  summary: D2 is a modern diagram scripting language that turns text to diagrams.
  license: MPL-2.0 AND EPL-2.0 AND Apache-2.0 AND BSD-3-Clause AND MIT AND (GPL-2.0-or-later OR LicenseRef-FreeType)
  license_file:
    - src/LICENSE.txt
    - library_licenses/
    - freetype-license.txt
    - freetype-license-ftl.txt
    - freetype-license-gpl.txt
    - goja-ftoa-license.txt
    - chroma-license.txt
    - src/d2layouts/d2elklayout/NOTICE.txt

extra:
  recipe-maintainers:
    - moritzwilksch
